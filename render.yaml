# Render blueprint — deploy with: https://dashboard.render.com/blueprints
#
# Frontend (Next.js) is NOT included here — deploy it to Vercel separately, with
# BACKEND_URL set to this backend service's public URL. Vercel needs no config file
# for a standard Next.js app.
#
# External managed dependencies NOT provisioned by this blueprint (set as env vars
# below via the Render dashboard, marked sync: false):
#   - Qdrant Cloud (QDRANT_URL, QDRANT_API_KEY)
#   - Groq (GROQ_API_KEY)
#   - S3-compatible object storage (S3_BUCKET, S3_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)

databases:
  - name: contextguard-db
    plan: starter
    databaseName: contextguard
    user: contextguard

services:
  - type: redis
    name: contextguard-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: contextguard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    dockerCommand: >
      sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: contextguard-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: contextguard-redis, type: redis, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_HOSTS
        sync: false   # e.g. ["contextguard-backend.onrender.com"]
      - key: CORS_ORIGINS
        sync: false   # e.g. ["https://your-frontend.vercel.app"]
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b

  - type: worker
    name: contextguard-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    dockerCommand: python -m app.worker.main
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: contextguard-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: contextguard-redis, type: redis, property: connectionString }
      - key: SECRET_KEY
        sync: false   # must match contextguard-backend's SECRET_KEY value
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
