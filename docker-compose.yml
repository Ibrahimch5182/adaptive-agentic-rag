services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contextguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextguard}
      POSTGRES_DB: contextguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ \"$$status\" == *\"200 OK\"* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend and worker share ONE image (contextguard-backend) built from the same
  # Dockerfile/context — never build two divergent images for the same app code.
  backend:
    build: ./backend
    image: contextguard-backend:latest
    environment: &backend_env
      DATABASE_URL: postgresql://contextguard:${POSTGRES_PASSWORD:-contextguard}@db:5432/contextguard
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: '["http://localhost:3000"]'
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_DIR: /app/data/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: openai/gpt-oss-20b
      ENVIRONMENT: development
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/app/data/uploads
      - model_cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Dev-only: migrate + reload. Production images run the Dockerfile's default
    # CMD (no --reload) — this override is explicitly local-dev-only, per Phase 6 rules.
    command: >
      sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./backend
    image: contextguard-backend:latest
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/app/data/uploads
      - model_cache:/root/.cache
    # Worker never runs migrations — backend owns that (see command above).
    command: python -m app.worker.main

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  qdrant_data:
  upload_data:
  model_cache:
